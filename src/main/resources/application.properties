

spring.application.name=hospitalmanager

# Configure the connection with DB_URL, DB_USERNAME, and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/hospital_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=8080

# Supply JWT_SECRET as Base64 for a random key of at least 32 bytes.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Optional bootstrap. Requires explicit username/password environment variables.
hospital.seed.admin.enabled=${HOSPITAL_SEED_ADMIN_ENABLED:false}
hospital.seed.admin.username=${HOSPITAL_ADMIN_USERNAME:}
hospital.seed.admin.password=${HOSPITAL_ADMIN_PASSWORD:}
hospital.seed.admin.name=${HOSPITAL_ADMIN_NAME:Hospital Administrator}

